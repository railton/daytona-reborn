name: Team queue tests
on:
  push:
    branches: [main]
    paths: ['tools/team_*.py', 'tools/schedule-*.ps1', 'tests/test_team_*.py', '.github/workflows/team.yml']
  pull_request:
    paths: ['tools/team_*.py', 'tools/schedule-*.ps1', 'tests/test_team_*.py', '.github/workflows/team.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install local-test runner
        run: python -m pip install pytest==9.2.0
      - name: Protocol and queue regression tests (no model calls)
        run: python -c "import glob,subprocess,sys; files=glob.glob('tests/test_team_*.py'); assert files, 'No team tests selected'; sys.exit(subprocess.call([sys.executable,'-m','pytest',*files,'-v']))"
      - name: Parse Windows scheduler script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          foreach ($script in @('schedule-team.ps1', 'schedule-project.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/tools/$script", [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
          }
