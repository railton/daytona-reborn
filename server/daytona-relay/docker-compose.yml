# The Online mode server for Daytona USA (Revision A).
#   Start:  docker compose up -d --build
#   Logs:   docker compose logs -f
#   Changed a variable? docker compose up -d (recreates the container)
services:
  daytona-relay:
    build: .
    image: daytona-relay
    container_name: daytona-relay
    restart: unless-stopped
    ports:
      - "${DAYTONA_PORT:-7777}:${DAYTONA_PORT:-7777}/tcp"
      # UDP on the same port: the games' data also by UDP (through packet loss); TCP is enough without it
      - "${DAYTONA_PORT:-7777}:${DAYTONA_PORT:-7777}/udp"
    environment:
      DAYTONA_PORT: "${DAYTONA_PORT:-7777}"
      # Optional password: only who knows it can use the server (it travels in the invite code).
      DAYTONA_PASSWORD: "${DAYTONA_PASSWORD:-}"
      DAYTONA_MAX_ROOMS: "${DAYTONA_MAX_ROOMS:-100}"
      DAYTONA_MAX_CONNECTIONS: "${DAYTONA_MAX_CONNECTIONS:-1000}"
      DAYTONA_MAX_PER_IP: "${DAYTONA_MAX_PER_IP:-16}"          # players behind one router share an address
      # Star mode: each player gets every other car's latest data in one hop, and a
      # dropped player may come back within 10 s. 0: the ring of 0.12 (diagnostics).
      DAYTONA_STAR: "${DAYTONA_STAR:-1}"
      # Race settings' defaults: the game shows them when creating a room, its creator may change them:
      DAYTONA_CABINET: "${DAYTONA_CABINET:-twin}"                 # twin | uplight | deluxe
      DAYTONA_COUNTRY: "${DAYTONA_COUNTRY:-usa}"                  # usa (English) | jpn (Japanese) | export
      DAYTONA_DIFFICULTY: "${DAYTONA_DIFFICULTY:-normal}"         # easy | normal | hard | hardest
      DAYTONA_GAME_MODE: "${DAYTONA_GAME_MODE:-normal}"           # normal | grandprix | endurance
      DAYTONA_RIVAL_ARROW: "${DAYTONA_RIVAL_ARROW:-on}"           # on | off
      DAYTONA_ADVERTISE_SOUND: "${DAYTONA_ADVERTISE_SOUND:-on}"   # on | off
      DAYTONA_FREE_PLAY: "${DAYTONA_FREE_PLAY:-on}"               # on: no coins, Start only | off
      DAYTONA_START: "${DAYTONA_START:-master}"                   # master: only the room's creator starts a race | anyone
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
